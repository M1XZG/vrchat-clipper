name: Build Windows executable

# Builds the single-file VRChat Clipper .exe on a native Windows runner
# (PyInstaller cannot cross-compile a Windows binary from Linux/macOS).
#
# * Runs on demand and on every tag push like v1.2.3.
# * Uploads dist/vrchat-clipper.exe as a build artifact.
# * On a version tag, also attaches the exe (plus the OVR Toolkit wrist-button
#   app and the example config) to a GitHub Release.

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "vrchat_clipper/**"
      - "web/**"
      - "app_main.py"
      - "vrchat-clipper.spec"
      - "requirements*.txt"
      - ".github/workflows/build-windows.yml"
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-exe.txt

      - name: Build executable
        run: pyinstaller --clean --noconfirm vrchat-clipper.spec

      - name: Smoke test the executable
        shell: pwsh
        run: |
          $exe = "dist/vrchat-clipper.exe"
          if (-not (Test-Path $exe)) { throw "Executable not found at $exe" }
          # Start headless (no tray, do not touch SteamVR) and probe the API.
          $proc = Start-Process -FilePath $exe -ArgumentList "--no-tray","--no-vr-register" -PassThru
          try {
            $ok = $false
            for ($i = 0; $i -lt 20; $i++) {
              Start-Sleep -Seconds 1
              try {
                $r = Invoke-WebRequest -UseBasicParsing http://127.0.0.1:8765/api/health -TimeoutSec 2
                if ($r.StatusCode -eq 200) { $ok = $true; break }
              } catch { }
            }
            if (-not $ok) { throw "Server did not become healthy in time" }
            $idx = Invoke-WebRequest -UseBasicParsing http://127.0.0.1:8765/ -TimeoutSec 5
            if ($idx.StatusCode -ne 200) { throw "Index did not return 200" }
            Write-Host "Smoke test passed: API healthy and web UI served."
          }
          finally {
            if ($proc -and -not $proc.HasExited) { Stop-Process -Id $proc.Id -Force }
          }

      - name: Stage release bundle
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path bundle | Out-Null
          Copy-Item dist/vrchat-clipper.exe bundle/
          Copy-Item config.example.json bundle/
          Copy-Item README.md bundle/
          Copy-Item -Recurse ovr-custom-app bundle/ovr-custom-app

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: vrchat-clipper-windows
          path: bundle
          if-no-files-found: error

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/vrchat-clipper.exe
            config.example.json
