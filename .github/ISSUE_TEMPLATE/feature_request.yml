name: Feature request
description: Suggest an idea or improvement.
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Got an idea for vrchat-clipper? Great. Describe what you'd like and, just as
        usefully, why — the underlying need often points at the best solution.
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: The problem or the moment where the current tool gets in your way.
      placeholder: When I record skits with friends I want to...
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would you like it to do?
      description: Your proposed feature or change.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Anything you've tried or considered
      description: Workarounds you're using now, or other approaches you thought about.
    validations:
      required: false
  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I searched existing issues and didn't find the same request.
          required: true
